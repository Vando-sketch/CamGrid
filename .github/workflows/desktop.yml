name: Desktop

# The desktop app on all three OSes: tests (on Linux also end to end against a real go2rtc),
# then the installers, each built on its own OS with only that OS's native libraries.
# No Android SDK needed (-Pcamgrid.skipAndroid=true).
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CAMGRID_BUILD_NUMBER: ${{ github.run_number }}
      # Also test the real OS credential store (Keychain, DPAPI); Linux runners have no
      # Secret Service, so the key file vault is what is tested there.
      CAMGRID_TEST_OS_VAULT: ${{ matrix.name != 'linux' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: go2rtc and test streams (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rpm
          curl -fsSL -o "$RUNNER_TEMP/go2rtc" https://github.com/AlexxIT/go2rtc/releases/download/v1.9.14/go2rtc_linux_amd64
          chmod +x "$RUNNER_TEMP/go2rtc"
          "$RUNNER_TEMP/go2rtc" -config desktop/e2e/go2rtc.yaml > "$RUNNER_TEMP/go2rtc.log" 2>&1 &
          echo "CAMGRID_IT_GO2RTC=http://127.0.0.1:1984" >> "$GITHUB_ENV"

      - name: Tests
        shell: bash
        run: ./gradlew -Pcamgrid.skipAndroid=true :desktop:test --stacktrace

      - name: Installers
        shell: bash
        run: ./gradlew -Pcamgrid.skipAndroid=true :desktop:packageDistributionForCurrentOS --stacktrace

      # Stable names, so the release links stay the same from build to build.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          arch=$(uname -m | sed 's/aarch64/arm64/; s/x86_64/x64/')
          for f in desktop/build/compose/binaries/main/*/*.{deb,rpm,msi,dmg}; do
            [ -f "$f" ] || continue
            cp "$f" "dist/camgrid-desktop-${{ matrix.name }}-$arch.${f##*.}"
          done
          ls -l dist

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: desktop-test-reports-${{ matrix.name }}
          path: |
            desktop/build/reports/
            desktop/build/e2e/
          if-no-files-found: ignore

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: camgrid-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Its own release tag, separate from the Android workflow's "preview" release: that one is
  # deleted and recreated on every Android build, which would race with uploads from here and
  # drop the installers. One job collects all three OSes and replaces the release in one go.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: camgrid-desktop-*
          path: dist
          merge-multiple: true

      - name: Publish desktop preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if [ "$GITHUB_REF_NAME" = "main" ]; then tag=preview-desktop; else tag="preview-desktop-${GITHUB_REF_NAME##*/}"; fi
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Desktop preview build ($GITHUB_REF_NAME)" \
            --notes "Desktop test build ${{ github.run_number }} from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Unsigned: on macOS right-click the app and choose Open the first time; on Windows choose More info, Run anyway. Linux: .deb (Debian, Ubuntu) or .rpm (Fedora, openSUSE). Bundles FFmpeg (LGPL-2.1) and libwebrtc; see desktop/README.md for licences and sources."
