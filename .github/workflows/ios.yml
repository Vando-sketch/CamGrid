name: iOS

# The iOS app: Kotlin tests in the simulator, a simulator build, and an UNSIGNED device .ipa
# (artifact camgrid-ios-unsigned) to sign with your own Apple ID, see docs/ios.md. No signing
# identity, team or provisioning profile is used or stored here.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["core/**", "shared/**", "iosApp/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["core/**", "shared/**", "iosApp/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # A branch of this repository already runs on push; its pull request would run everything twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PROJECT: iosApp/CamGrid.xcodeproj
      PACKAGES: ${{ github.workspace }}/.spm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Also save the cache from feature branches; by default only main writes it.
          cache-read-only: false

      # The Kotlin/Native toolchain and its iOS caches (about 1 GB), otherwise downloaded and
      # rebuilt on every run.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # Gradle configures the :shared module's Android target even for iOS builds, so it needs
      # an Android SDK to exist (nothing Android is compiled). GitHub's macOS images ship one and
      # set ANDROID_HOME; install it only if that ever changes.
      - name: Check for an Android SDK
        id: sdk
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            echo "Android SDK at $ANDROID_HOME"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Android SDK
        if: steps.sdk.outputs.missing == 'true'
        uses: android-actions/setup-android@v3

      - name: Kotlin tests in the iOS simulator
        run: ./gradlew -Pcamgrid.skipAndroid=true :core:iosSimulatorArm64Test :shared:iosSimulatorArm64Test --stacktrace

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('iosApp/project.yml') }}

      - name: Resolve Swift packages (WebRTC, VLCKit)
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme CamGrid -clonedSourcePackagesDirPath "$PACKAGES"

      # arm64 only: Kotlin is built for Apple silicon simulators (iosSimulatorArm64).
      - name: Build for the iOS simulator
        run: |
          xcodebuild build \
            -project "$PROJECT" -scheme CamGrid -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$PACKAGES" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the unsigned device app
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme CamGrid -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CamGrid.xcarchive" \
            -clonedSourcePackagesDirPath "$PACKAGES" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the unsigned .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$RUNNER_TEMP/CamGrid.xcarchive/Products/Applications/CamGrid.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/CamGrid-unsigned.ipa" Payload)
          ls -l dist

      - name: Upload the unsigned .ipa
        uses: actions/upload-artifact@v5
        with:
          name: camgrid-ios-unsigned
          path: dist/CamGrid-unsigned.ipa

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-test-reports
          path: |
            core/build/reports/
            shared/build/reports/
          if-no-files-found: ignore
