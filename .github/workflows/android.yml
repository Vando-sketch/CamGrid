name: Android
run-name: "Android build ${{ github.run_number }} on ${{ github.ref_name }}"

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"] # a stable release, see docs/releasing.md
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    # A branch of this repository already runs on push; its pull request would run everything
    # twice. Skipping this job skips the jobs that need it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/version.yml
    permissions:
      contents: read
    secrets: # only checked for being set, on a release tag
      CAMGRID_KEYSTORE_BASE64: ${{ secrets.CAMGRID_KEYSTORE_BASE64 }}
      CAMGRID_KEYSTORE_PASSWORD: ${{ secrets.CAMGRID_KEYSTORE_PASSWORD }}
      CAMGRID_KEY_ALIAS: ${{ secrets.CAMGRID_KEY_ALIAS }}
      CAMGRID_KEY_PASSWORD: ${{ secrets.CAMGRID_KEY_PASSWORD }}

  build:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # to publish the preview release and submit the dependency graph
    # Optional signing secrets. With them every build is signed with the same key, so a new
    # APK installs over the old one; without them each run gets a fresh debug key. Required
    # for a release.
    env:
      KEYSTORE_BASE64: ${{ secrets.CAMGRID_KEYSTORE_BASE64 }}
      CAMGRID_KEYSTORE_PASSWORD: ${{ secrets.CAMGRID_KEYSTORE_PASSWORD }}
      CAMGRID_KEY_ALIAS: ${{ secrets.CAMGRID_KEY_ALIAS }}
      CAMGRID_KEY_PASSWORD: ${{ secrets.CAMGRID_KEY_PASSWORD }}
      # versionCode: each build must be higher than the installed one to count as an update.
      CAMGRID_BUILD_NUMBER: ${{ github.run_number }}
      # X.Y.Z on a release tag, X.Y.Z-preview.<run> on main, X.Y.Z-dev.<run> otherwise.
      CAMGRID_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # A release must install over the previous one, so it is never signed with a one-off key.
      - name: Require the signing key for a release
        if: needs.version.outputs.channel == 'stable' && (env.KEYSTORE_BASE64 == '' || env.CAMGRID_KEYSTORE_PASSWORD == '' || env.CAMGRID_KEY_ALIAS == '' || env.CAMGRID_KEY_PASSWORD == '')
        run: |
          echo "::error title=No signing key::A release needs the CAMGRID_KEYSTORE_BASE64, CAMGRID_KEYSTORE_PASSWORD, CAMGRID_KEY_ALIAS and CAMGRID_KEY_PASSWORD secrets. Not publishing a release signed with a one-off key. See docs/releasing.md, Signing key."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # v6 defaults to a closed-source cache under Gradle's terms of use; keep the MIT one.
          cache-provider: basic
          # Also save the cache from feature branches; by default only main writes it.
          cache-read-only: false
          # GitHub cannot read Gradle files for Dependabot security alerts, so main submits the
          # resolved dependency graph. PRs don't, they lack the write permission from forks.
          dependency-graph: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'generate-and-submit' || 'disabled' }}

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/camgrid.jks"
          echo "CAMGRID_KEYSTORE_FILE=$RUNNER_TEMP/camgrid.jks" >> "$GITHUB_ENV"
          echo "CAMGRID_SIGNING=stable" >> "$GITHUB_ENV"

      - name: Warn about missing signing key
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning title=No signing key::CAMGRID_KEYSTORE_BASE64 is not set. This build is signed with a one-off debug key, so it cannot update an installed CamGrid (uninstall first). See docs/releasing.md, Signing key."
          echo "CAMGRID_SIGNING=one-off" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew test :core:jvmTest :shared:desktopTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          mkdir -p dist
          # CamGrid-Android.apk is the one to install (phone and Fire TV). The minified release
          # build is only in the workflow artifact, so the release page offers one obvious file.
          cp app/build/outputs/apk/debug/app-debug.apk dist/CamGrid-Android.apk
          # Transition copy under the old name, so saved links and Fire TV Downloader entries for
          # .../preview/camgrid-debug.apk keep working. Remove once everyone uses the new link.
          cp dist/CamGrid-Android.apk dist/camgrid-debug.apk
          mkdir -p dist-extra
          cp app/build/outputs/apk/release/app-release.apk dist-extra/CamGrid-Android-minified.apk

      # Every published APK has to install over the one users already have: same package, same
      # key (app/signing-cert.sha256) and a versionCode not lower than the published preview and
      # the latest stable release. Otherwise every user would have to uninstall and lose settings.
      - name: Check the APK can update installed CamGrid
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s .github/scripts
          if [ "$CAMGRID_SIGNING" != stable ]; then
            if [ "$GITHUB_REF_NAME" = main ]; then
              echo "::error title=No signing key::main must not publish a build with a one-off key; every user would have to uninstall."
              exit 1
            fi
            echo "One-off key on a branch build: skipping the update check."
            exit 0
          fi
          previous=()
          mkdir -p "$RUNNER_TEMP/published"
          if gh release download preview -p CamGrid-Android.apk -O "$RUNNER_TEMP/published/preview.apk"; then
            previous+=(--previous "$RUNNER_TEMP/published/preview.apk")
          fi
          # Without a tag, gh picks the latest stable release (pre-releases never count as latest).
          if gh release download -p CamGrid-Android.apk -O "$RUNNER_TEMP/published/latest-release.apk"; then
            previous+=(--previous "$RUNNER_TEMP/published/latest-release.apk")
          fi
          python3 .github/scripts/check_android_update.py --expected-cert app/signing-cert.sha256 \
            --apk dist/CamGrid-Android.apk --apk dist-extra/CamGrid-Android-minified.apk "${previous[@]}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-test-reports
          path: "**/build/reports/"
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: CamGrid-Android-build-${{ github.run_number }}
          path: |
            dist/CamGrid-Android.apk
            dist-extra/*.apk

      # A plain .apk link that works in a phone browser (workflow artifacts are zipped and need
      # a GitHub login). Only main publishes; each build replaces the "preview" pre-release.
      # Other branches keep their APKs in the workflow artifact only.
      - name: Publish preview release
        # Also on a manual run of main (Actions > Run workflow), e.g. after the signing secrets change.
        if: needs.version.outputs.channel == 'preview' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=preview
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/CamGrid-Android.apk dist/camgrid-debug.apk \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "CamGrid Android preview build ${CAMGRID_BUILD_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Preview build ${CAMGRID_BUILD_NUMBER} of main, not a stable release; the stable release is at https://github.com/${GITHUB_REPOSITORY}/releases/latest. Android and Fire TV, version ${CAMGRID_VERSION}, commit ${GITHUB_SHA::7}. Install CamGrid-Android.apk (camgrid-debug.apk is the same file under its old name, kept for old links). Signing key: ${CAMGRID_SIGNING} (one-off means it cannot update an installed CamGrid; uninstall first)."

      # Branch builds used to publish preview-<branch>, preview-desktop-<branch> and
      # preview-ios-<branch> pre-releases. Delete those and any leftover preview-* tags; keep
      # exactly "preview", "preview-desktop" and "preview-ios". Not worth failing the build over.
      - name: Delete stale branch previews
        if: needs.version.outputs.channel == 'preview' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          keep() { [ "$1" = preview-desktop ] || [ "$1" = preview-ios ]; }
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            case "$tag" in preview-*) ;; *) continue ;; esac
            keep "$tag" && continue
            echo "Deleting release and tag $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
          # Tags whose release is already gone.
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/preview-" --jq '.[].ref' | while read -r ref; do
            tag="${ref#refs/tags/}"
            keep "$tag" && continue
            echo "Deleting tag $tag"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
          done

  # On a vX.Y.Z tag: CamGrid-Android.apk, NOTICE and LICENSE on the "CamGrid X.Y.Z" release.
  release:
    name: Release
    needs: [version, build]
    if: needs.version.outputs.channel == 'stable'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-pattern: CamGrid-Android-build-*
      files: CamGrid-Android.apk
      legal-files: true
