name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # to publish the preview release
    # Optional signing secrets. With them every build is signed with the same key, so a new
    # APK installs over the old one; without them each run gets a fresh debug key.
    env:
      KEYSTORE_BASE64: ${{ secrets.CAMGRID_KEYSTORE_BASE64 }}
      CAMGRID_KEYSTORE_PASSWORD: ${{ secrets.CAMGRID_KEYSTORE_PASSWORD }}
      CAMGRID_KEY_ALIAS: ${{ secrets.CAMGRID_KEY_ALIAS }}
      CAMGRID_KEY_PASSWORD: ${{ secrets.CAMGRID_KEY_PASSWORD }}
      # versionCode: each build must be higher than the installed one to count as an update.
      CAMGRID_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/camgrid.jks"
          echo "CAMGRID_KEYSTORE_FILE=$RUNNER_TEMP/camgrid.jks" >> "$GITHUB_ENV"
          echo "CAMGRID_SIGNING=stable" >> "$GITHUB_ENV"

      - name: Warn about missing signing key
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning title=No signing key::CAMGRID_KEYSTORE_BASE64 is not set. This build is signed with a one-off debug key, so it cannot update an installed CamGrid (uninstall first). See README, CI and signing."
          echo "CAMGRID_SIGNING=one-off" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew test :core:jvmTest :shared:desktopTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/camgrid-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/camgrid-release.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: "**/build/reports/"
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: camgrid-apks
          path: dist/*.apk

      # A plain .apk link that works in a phone browser (workflow artifacts are zipped and need
      # a GitHub login). Each push replaces the previous preview of the same branch: main
      # publishes "preview", any other branch "preview-<last part of the branch name>", so a
      # feature branch never replaces the build someone is testing from another branch.
      - name: Publish preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then tag=preview; else tag="preview-${GITHUB_REF_NAME##*/}"; fi
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Preview build ($GITHUB_REF_NAME)" \
            --notes "Test build ${CAMGRID_BUILD_NUMBER} from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install camgrid-debug.apk. Signing key: ${CAMGRID_SIGNING} (one-off means it cannot update an installed CamGrid; uninstall first)."
